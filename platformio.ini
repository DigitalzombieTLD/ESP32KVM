; ESP32KVM - remote USB keyboard over SSH for ESP32-S3 (16MB flash, 8MB octal PSRAM)

[env:esp32-s3-kvm]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200

; 16MB flash, QIO flash + octal PSRAM (N16R8 modules)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.filesystem = spiffs

lib_deps =
    https://github.com/DigitalzombieTLD/LibSSH-ESP32.git#343fce1c5d1d0e3d629807dece6ae1b68ef1d322

build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    ; Native USB (USB-OTG) as TinyUSB HID device. The USB-Serial/JTAG CDC is not used;
    ; logging goes to UART0 (GPIO43 TX / GPIO44 RX, the "UART" port of the devkit).
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=1

build_unflags =
    -std=gnu++11
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
